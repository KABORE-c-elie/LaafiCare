[package]
name = "laaficare-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
# Chiffrement du secret TOTP en AES-256-GCM (décision Z4). 0.11.1 stable,
# vérifiée sur crates.io le 2026-10-05. Fonctionnalités par défaut (aes,
# alloc, getrandom : nonce aléatoire par `Generate`) + zeroize, pour effacer
# la clé de la mémoire.
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", default-features = false, features = ["typed-header"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
# Second facteur TOTP, RFC 6238 (décision Z1). 6.0.0 stable, vérifiée sur
# crates.io le 2026-10-05. otpauth : URL `otpauth://` (Z2) ; gen_secret :
# secret de 160 bits généré par la crate ; zeroize : secret effacé de la
# mémoire.
totp-rs = { version = "6.0.0", features = ["otpauth", "gen_secret", "zeroize"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# Normalisation NFC des mots de passe avant hachage (décision N1, NIST SP
# 800-63B rév. 4 §3.1.1.2). Déjà présente dans le projet via sqlx-postgres
# (stringprep), à la même version : la déclarer ne compile rien de nouveau.
unicode-normalization = "0.1.25"
# Fonctionnalité serde (décision A4) : Uuid lisible et écrit en JSON et dans
# les URL (Path). Cargo fusionne les fonctionnalités : sqlx::types::Uuid est
# le même type (une seule version d'uuid dans Cargo.lock).
uuid = { version = "1.26.1", features = ["serde"] }
# Effacement du secret TOTP déchiffré (totp.rs, `dechiffrer_secret`), là où
# la fonctionnalité zeroize de totp-rs ne suffit pas. Déjà présente via
# aes-gcm et totp-rs, à la même version : la déclarer ne compile rien de
# nouveau.
zeroize = "1.9.0"

# Tests en développement : Argon2id (m=19456, t=2, p=1) est très lent sans
# optimisation. On optimise seulement la crate argon2 (Cargo Book,
# « Profiles → Overrides »). Les paramètres de hachage ne changent pas, ni le
# profil de production (`release`, déjà optimisé). Mesuré le 2026-10-08 :
# tests de la bibliothèque de 101,7 s à 23,3 s ; optimiser aussi blake2
# n'apporte rien.
[profile.dev.package.argon2]
opt-level = 3
