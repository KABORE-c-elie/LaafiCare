# PostgreSQL de développement local — jamais utilisé en production.
services:
  db:
    image: postgres:18-alpine
    container_name: laaficare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: laaficare
      # Lu dans backend/.env (non suivi par Git), à côté de ce fichier : doc
      # Docker Compose, « Variable interpolation ». « :? » arrête Compose
      # avec ce message si la variable est absente ou vide. Seule cette
      # variable entre dans le conteneur, pas tout le .env (JWT, clé TOTP).
      # Attention : l'image postgres n'applique ce mot de passe qu'à la
      # création du volume ; le changer ensuite ne change pas celui de la base.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans backend/.env (voir .env.example)}
      POSTGRES_DB: laaficare
    ports:
      # Exposé uniquement sur la machine locale, pas sur le réseau.
      # 5433 côté hôte : le 5432 est pris par le conteneur d'un autre projet.
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18+ : le volume se monte sur /var/lib/postgresql (plus /data).
      - laaficare_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laaficare -d laaficare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  laaficare_pgdata:
